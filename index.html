<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>低碳家園小幫手｜第二版</title><meta name="description" content="低碳永續家園公開資訊客服"><link rel="stylesheet" href="style.css"></head><body>
<main class="demo"><span class="demo-tag">低碳永續家園 · 客服第二版</span><h1>讓每一個低碳行動，<br>都有清楚的下一步。</h1><p>認證、操作、行動項目與公開資訊，<br>點右下角的小幫手，從一個問題開始。</p><a href="https://lcss.moenv.gov.tw/" target="_blank" rel="noopener">前往低碳永續家園網 ↗</a><small>此頁為浮動客服展示頁</small></main>
<button id="launcher" class="launcher" aria-controls="widget" aria-expanded="true">✳ <span>低碳小幫手</span></button>
<section id="widget" class="chat-shell" aria-label="低碳家園客服"><header class="chat-heading"><div class="avatar" aria-hidden="true">✳</div><div><h2>低碳家園小幫手</h2><p><i></i> 公開資訊查詢 · V2</p></div><button id="close-widget" aria-label="收起客服">×</button></header><div class="conversation" id="conversation" role="log" aria-live="polite" aria-relevant="additions"></div><div class="composer-area"><div class="context-line" id="context-line" hidden></div><nav class="utility-actions" aria-label="對話工具"><button id="back-button">← 上一層</button><button id="home-button">主選單</button><button id="contact-button">聯絡客服</button><button id="clear-button">重新開始</button></nav><form id="composer"><label class="sr-only" for="question">輸入問題</label><textarea id="question" placeholder="輸入你想了解的問題…" rows="1" maxlength="1500"></textarea><button class="send" type="submit" aria-label="送出問題">↑</button></form><p class="composer-note">依公開題庫提供回答 · 最新資訊以官方公告為準</p></div></section><script type="module" src="app.mjs"></script></body></html>
